[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fanpage-agent"
version = "0.15.0"
description = "Autonomous Facebook fanpage agent"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "requests>=2.31",
    "Pillow>=10.0",
    "curl_cffi>=0.15",
    "playwright>=1.60",
    "browserforge>=1.2",
    "scrapling>=0.4.0",
    "ddgs>=9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
fanpage-agent = "fanpage_cli:main"
fanpage-manager = "fanpage_agent.manager_cli:main"

[tool.setuptools.packages.find]
include = ["fanpage_agent*", "fanpage_cli*"]

[tool.setuptools]
py-modules = ["agent", "config", "tools", "scheduler", "cli"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (network-dependent), skipped by default",
]
addopts = "-m 'not slow' --tb=short"
filterwarnings = [
    "ignore:The 'strip_cdata' option.*:DeprecationWarning",
]


[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    "tests",
    "scripts",
    "fanpage_agent.egg-info",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E501",  # Prefer readability over mechanical line wrapping for copy-heavy prompts.
]
