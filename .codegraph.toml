[project]
name = "fanpage-agent"
source_dir = "."

[parser]
language = "python"
follow_imports = true
exclude = ["venv", "tests", "__pycache__", ".git", "artifacts", "node_modules"]

[llm]
provider = "openai"
model = "deepseek-chat"
base_url = "https://api.deepseek.com"

[server]
host = "127.0.0.1"
port = 9876
mcp_enabled = true
